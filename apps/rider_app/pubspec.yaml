name: rider_app
description: PMart 라이더 앱
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  intl: ^0.20.3
  # 지도(고객앱과 같은 판) · QR 카메라(MFC 앱과 같은 판)
  kakao_map_sdk: ^1.3.1
  mobile_scanner: ^7.5.0
  pmart_core:
    path: ../../packages/pmart_core
  pmart_ui:
    path: ../../packages/pmart_ui
  pmart_api_delivery_dispatch:
    path: ../../packages/pmart_api/gen/delivery-dispatch
  pmart_api_rider:
    path: ../../packages/pmart_api/gen/rider
  pmart_api_rider_auth:
    path: ../../packages/pmart_api/gen/rider-auth
  pmart_api_center_master:
    path: ../../packages/pmart_api/gen/center-master
  pmart_api_case:
    path: ../../packages/pmart_api/gen/case
  pmart_api_notification:
    path: ../../packages/pmart_api/gen/notification
  # 라이더 Google 로그인(rider-auth). 고객앱과 같은 버전.
  google_sign_in: ^7.2.0
  # 라이더 카카오 로그인(OIDC idToken, 사용자 승인 2026-11-19, 고객앱과 같은 판). 서버(rider-auth)가 받기 전에는 목 모드에서만 버튼.
  # 네이버는 액세스 토큰만 주는 flutter_naver_login 대신 아래 flutter_appauth(OIDC) 를 쓴다(ADR-0071).
  kakao_flutter_sdk_user: ^2.1.0
  # 네이버 로그인 — OIDC 인가 코드 + PKCE 로 id_token(서버 rider-auth 0.2.0 이 받는 것). 고객앱과 같은 버전, 사용자 승인 2026-11-19.
  flutter_appauth: ^13.0.0
  pmart_api_delivery_execution:
    path: ../../packages/pmart_api/gen/delivery-execution
  pmart_api_mfc_fulfillment:
    path: ../../packages/pmart_api/gen/mfc-fulfillment
  pmart_api_delivery_tracking:
    path: ../../packages/pmart_api/gen/delivery-tracking
  geolocator: ^14.1.2
  # 전달 증빙 사진(고객앱과 같은 판) · 고객·가게 전화(tel:)
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  kakao_flutter_sdk_navi: 2.1.0
  flutter_inappwebview: 6.1.5
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # 라이더 약관 5종 본문(docs/PMart_라이더앱_약관_5종.md 에서 나눔).
  assets:
    - assets/terms/
    # 시작 화면 그림(사용자 2026-11-19).
    - assets/splash/
    # 배달완료 카드 그림(사용자가 만든 캐릭터, 2026-11-23).
    - assets/images/
  # Pretendard (SIL OFL 1.1, assets/fonts/Pretendard-LICENSE.txt) — 고객앱과 같은 글꼴(사용자 2026-11-20 "폰트도 구리고").
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
